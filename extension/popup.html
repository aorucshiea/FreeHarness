<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --line:#e5e7eb; --muted:#8a8f98; --ok:#3B6D11; --bad:#A32D2D; --brand:#185FA5; }
  body { width:360px; margin:0; padding:10px 12px 12px; background:#f7f7f8; font:13px/1.55 system-ui,"Segoe UI",sans-serif; color:#222; }
  h3 { margin:2px 0 8px; font-size:14px; font-weight:700; letter-spacing:.2px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
  .card-pad { padding:8px 10px; }
  .card > h4 { margin:0 0 6px; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.6px; }
  .statusbar { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; }
  .statusbar .sp { flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:#c3c7cc; flex:none; }
  .dot.on { background:var(--ok); }
  .dot.off { background:var(--bad); }
  .switchrow { display:flex; gap:12px; flex-wrap:wrap; }
  .switchrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--brand); margin:0; }
  input[type=number] { width:52px; padding:1px 4px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  button { padding:4px 10px; font-size:12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:#222; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button:hover { filter:brightness(.97); }
  textarea { width:100%; box-sizing:border-box; font:12px/1.5 system-ui; border:1px solid var(--line); border-radius:6px; padding:6px; resize:vertical; color:#222; background:#fff; }
  textarea:focus { outline:none; border-color:var(--brand); }
  details > summary { cursor:pointer; font-size:12px; color:var(--muted); user-select:none; padding:8px 10px; }
  details > summary:hover { color:#333; }
  details[open] > summary { border-bottom:1px dashed var(--line); color:#333; }
  details .inner { padding:8px 10px; }
  details pre { max-height:140px; overflow:auto; background:#f6f7f8; padding:6px; font-size:11px; white-space:pre-wrap; word-break:break-all; border-radius:6px; color:#333; margin:6px 0 0; }
  .injectrow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .injectrow .hint { flex:1; text-align:right; font-size:12px; color:var(--muted); }
  .catlist { display:grid; grid-template-columns:1fr 1fr; gap:3px 8px; margin-top:4px; }
  .catlist label { display:flex; align-items:center; gap:5px; font-size:12px; cursor:pointer; }
  #log { max-height:170px; overflow-y:auto; font-size:12px; color:#444; }
  #log .e { padding:3px 0; border-bottom:1px dashed #eee; word-break:break-all; }
  #log .t { color:#aaa; margin-right:6px; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); font-size:12px; }
  .row { display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>
  <h3>FreeHarness <span class="muted" style="font-weight:400;">解放网页 AI</span></h3>

  <div class="statusbar">
    <span class="dot" id="dot"></span>
    <span id="statusText">检测本地服务…</span>
    <span class="sp"></span>
    <span class="muted" id="roundsInfo"></span>
  </div>

  <div class="card card-pad">
    <h4>常用</h4>
    <div class="switchrow">
      <label><input type="checkbox" id="enabled">启用</label>
      <label><input type="checkbox" id="autoSend">自动发送结果</label>
      <label><input type="checkbox" id="selfDrive" title="AI 可以用 [SELF_PROMPT] 给自己下发下一步，自动连续推进（最多 10 轮）">AI 自我驱动</label>
    </div>
  </div>

  <div class="card card-pad">
    <h4>提示词</h4>
    <div class="injectrow">
      <button class="primary" id="injectPrompt">注入提示词</button>
      <button id="promptCfgBtn">设置</button>
      <button id="reloadTab" style="display:none;">刷新本页</button>
      <span class="hint" id="injectHint"></span>
    </div>
    <div id="promptCfg" style="display:none; margin-top:8px;">
      <textarea id="persona" rows="2" placeholder="小助手人设（可选）：如「简洁高效的中文助手」"></textarea>
      <div class="muted" style="margin-top:8px;">注入哪些工具（工具说明按当前系统自动适配）：</div>
      <div id="catList" class="catlist"></div>
      <details style="margin-top:6px;">
        <summary style="padding:4px 0;">预览注入内容（核心提示词 · 已锁定）</summary>
        <pre id="coreView"></pre>
      </details>
      <div class="muted" id="platInfo" style="margin-top:4px;"></div>
    </div>
  </div>

  <details class="card">
    <summary>高级设置</summary>
    <div class="inner row">
      轮次上限 <input type="number" id="maxRounds" min="1" max="100">
      <button id="resetRounds">重置轮次</button>
      <button id="clear">清空日志</button>
    </div>
  </details>

  <details class="card">
    <summary id="logSummary">执行日志</summary>
    <div class="inner"><div id="log"></div></div>
  </details>

  <p class="muted" style="margin:8px 2px 0;">服务未启动会自动拉起；异常时刷新页面（Ctrl+F5）或重新加载扩展。</p>
  <script src="prompts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
