<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; padding: 12px; font: 13px/1.6 system-ui, "Segoe UI", sans-serif; color: #222; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .status { font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #bbb; margin-right: 4px; vertical-align: middle; }
  .dot.on { background: #3B6D11; }
  .dot.off { background: #A32D2D; }
  input[type="checkbox"] { accent-color: #185FA5; }
  input[type="number"] { width: 56px; }
  button { padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .sect { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; }
  .sect-title { font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; box-sizing: border-box; font: 12px/1.5 system-ui; border: 1px solid #ccc; border-radius: 4px; padding: 6px; resize: vertical; color: #222; background: #fff; }
  details { margin: 6px 0; }
  details summary { cursor: pointer; }
  details pre { max-height: 140px; overflow: auto; background: #f6f6f6; padding: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all; border-radius: 4px; color: #333; }
  #injectHint { flex: 1; text-align: right; }
  #log { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px; max-height: 150px; overflow-y: auto; font-size: 12px; color: #444; }
  #log .e { padding: 2px 0; border-bottom: 1px dashed #eee; word-break: break-all; }
  #log .t { color: #999; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .muted { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h3>WebHarness 控制台</h3>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测本地服务…</span></div>
  <div class="row"><input type="checkbox" id="enabled"><label for="enabled">启用（总开关）</label></div>
  <div class="row"><input type="checkbox" id="autoSend"><label for="autoSend">自动发送结果到网页</label></div>
  <div class="row">轮次上限 <input type="number" id="maxRounds" min="1" max="100"><span class="muted">连续工具调用最大轮数</span></div>
  <div class="row"><button id="resetRounds">重置轮次计数</button><button id="clear">清空日志</button></div>

  <div class="sect">
    <div class="sect-title">提示词（一键注入，无需复制粘贴）</div>
    <textarea id="persona" rows="3" placeholder="小助手人设（可选）：如「你是一位简洁高效的中文助手，回答尽量短」。留空则只用核心提示词。"></textarea>
    <details>
      <summary class="muted">查看核心提示词（⚠️ 已锁定：含工具协议，修改后 AI 可能无法执行任何操作）</summary>
      <pre id="coreView"></pre>
    </details>
    <div class="row"><button id="injectPrompt">注入到当前对话</button><span id="injectHint" class="muted"></span></div>
  </div>

  <div id="log"></div>
  <p class="muted">服务未启动会自动拉起；若工具无响应，刷新页面（Ctrl+F5）或重新加载扩展。</p>
  <script src="prompts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
