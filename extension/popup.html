<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 12px; font: 13px/1.6 system-ui, "Segoe UI", sans-serif; color: #222; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .status { font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #bbb; margin-right: 4px; vertical-align: middle; }
  .dot.on { background: #3B6D11; }
  .dot.off { background: #A32D2D; }
  input[type="checkbox"] { accent-color: #185FA5; }
  input[type="number"] { width: 56px; }
  button { padding: 3px 10px; font-size: 12px; cursor: pointer; }
  #log { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px; max-height: 220px; overflow-y: auto; font-size: 12px; color: #444; }
  #log .e { padding: 2px 0; border-bottom: 1px dashed #eee; word-break: break-all; }
  #log .t { color: #999; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .muted { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h3>WebHarness 控制台</h3>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测本地服务…</span></div>
  <div class="row"><input type="checkbox" id="enabled"><label for="enabled">启用（总开关）</label></div>
  <div class="row"><input type="checkbox" id="autoSend"><label for="autoSend">自动发送结果到网页</label></div>
  <div class="row">轮次上限 <input type="number" id="maxRounds" min="1" max="100"><span class="muted">连续工具调用最大轮数</span></div>
  <div class="row"><button id="resetRounds">重置轮次计数</button><button id="clear">清空日志</button></div>
  <div id="log"></div>
  <p class="muted">服务未启动？双击 server/start_server.bat</p>
  <script src="popup.js"></script>
</body>
</html>
